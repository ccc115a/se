# 啟動：docker compose up -d --build
# 入口：http://localhost:8080
services:
  nginx:
    build: ./nginx
    container_name: ms-nginx
    ports:
      - "8080:80"
    depends_on:
      - node
      - python
      - rust
    networks: [frontend, backend]
    restart: unless-stopped

  node:
    build: ./services/node
    container_name: ms-node
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-demo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-demo_pw}
      PGDATABASE: ${POSTGRES_DB:-demo}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  python:
    build: ./services/python
    container_name: ms-python
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-demo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-demo_pw}
      PGDATABASE: ${POSTGRES_DB:-demo}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  rust:
    build: ./services/rust
    container_name: ms-rust
    networks: [backend]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_pw}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pgdata:
