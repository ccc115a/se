server {
    listen 80;
    server_name _;

    # 靜態網頁
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy：以服務名稱透過 Docker 內部 DNS 轉發
    # proxy_pass 結尾的 "/" 會把 /api/node/ 前綴去掉
    location /api/node/ {
        proxy_pass http://node:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/python/ {
        proxy_pass http://python:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/rust/ {
        proxy_pass http://rust:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
