upstream frontend {
    server frontend:3000;
}
upstream api {
    server api:8000;
}
upstream sysinfo {
    server sysinfo:9000;
}

server {
    listen 80;
    server_name _;

    # 前端頁面與靜態資源
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Node 健康檢查與資訊 (經 nginx 透傳)
    location = /health {
        proxy_pass http://frontend/health;
    }
    location = /frontend-info {
        proxy_pass http://frontend/frontend-info;
    }

    # Python API：注意 trailing slash，保留 /api/ 前綴給 FastAPI
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rust 微服務
    location /sys/ {
        proxy_pass http://sysinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
